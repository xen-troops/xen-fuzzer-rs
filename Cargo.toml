[package]
name = "xen_fuzzer"
version = "0.2.0"
edition = "2021"

[dependencies]
libafl = {git = "https://github.com/AFLplusplus/LibAFL", features = [
    "multipart_inputs",
    ]}
libafl_bolts = {git = "https://github.com/AFLplusplus/LibAFL"}
libafl_qemu = { git = "https://github.com/AFLplusplus/LibAFL", features = [
   "aarch64",
   "systemmode",
 ], default-features = false }
libafl_targets = { git = "https://github.com/AFLplusplus/LibAFL" }

env_logger = "0.11.5"
log = "0.4.26"
clap = { version = "4.5.30", features = ["derive"] }
serde = "1.0.219"
bytes = "1.10.1"
enum_delegate = "0.2"
paste = "1.0.6"

[build-dependencies]
libafl_qemu_build = { git = "https://github.com/AFLplusplus/LibAFL" }
bindgen = "0.71.0"
